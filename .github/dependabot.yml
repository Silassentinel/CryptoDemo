# Dependabot version updates. Security updates are enabled separately in the repo settings.
# Minor/patch bumps are grouped into one PR per ecosystem; majors still get their own PR.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
